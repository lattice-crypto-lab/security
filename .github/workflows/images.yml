name: Publish container images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Select changed images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      count: ${{ steps.changes.outputs.count }}
      estimator_changed: ${{ steps.changes.outputs.estimator_changed }}
      matrix: ${{ steps.changes.outputs.matrix }}
      previous_version: ${{ steps.changes.outputs.previous_version }}
      security_changed: ${{ steps.changes.outputs.security_changed }}
      stable: ${{ steps.changes.outputs.stable }}

    steps:
      - name: Check out release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi

      - name: Detect image inputs changed since the previous release
        id: changes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          estimator_changed=false
          security_changed=false

          if [[ -z "${previous_tag}" ]]; then
            estimator_changed=true
            security_changed=true
          else
            changed_files="$(git diff --name-only "${previous_tag}" "${GITHUB_SHA}")"
            if grep -Eq '^(estimator-api/|estimator$|\.gitmodules$|\.dockerignore$)' <<<"${changed_files}"; then
              estimator_changed=true
            fi
            if grep -Eq '^(security-service/|web/|rust-toolchain\.toml$|\.dockerignore$)' <<<"${changed_files}"; then
              security_changed=true
            fi
          fi

          include=()
          if [[ "${estimator_changed}" == true ]]; then
            include+=('{"image":"estimator-api","dockerfile":"estimator-api/Dockerfile"}')
          fi
          if [[ "${security_changed}" == true ]]; then
            include+=('{"image":"security-service","dockerfile":"security-service/Dockerfile"}')
          fi
          matrix="$(IFS=,; echo "{\"include\":[${include[*]}]}")"
          previous_version="${previous_tag#v}"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            stable=true
          else
            stable=false
          fi

          echo "Previous release: ${previous_tag:-none}"
          echo "estimator-api changed: ${estimator_changed}"
          echo "security-service changed: ${security_changed}"
          echo "count=${#include[@]}" >> "${GITHUB_OUTPUT}"
          echo "estimator_changed=${estimator_changed}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "previous_version=${previous_version}" >> "${GITHUB_OUTPUT}"
          echo "security_changed=${security_changed}" >> "${GITHUB_OUTPUT}"
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out repository and estimator
        uses: actions/checkout@v6
        with:
          submodules: ${{ matrix.image == 'estimator-api' && 'recursive' || 'false' }}

      - name: Verify estimator commit
        if: matrix.image == 'estimator-api'
        shell: bash
        run: |
          expected_commit="$(git ls-tree HEAD estimator | awk '{print $3}')"
          actual_commit="$(git -C estimator rev-parse HEAD)"
          if [[ -z "${expected_commit}" ]]; then
            echo "The estimator Gitlink is missing from this release" >&2
            exit 1
          fi
          if [[ "${actual_commit}" != "${expected_commit}" ]]; then
            echo "Expected estimator ${expected_commit}, found ${actual_commit}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ needs.changes.outputs.stable == 'true' }}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  alias-unchanged-latest:
    name: Ensure latest aliases without rebuilding
    needs:
      - changes
      - publish
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.changes.outputs.stable == 'true' &&
      needs.changes.outputs.previous_version != ''
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add latest aliases for unchanged images
        shell: bash
        env:
          ESTIMATOR_CHANGED: ${{ needs.changes.outputs.estimator_changed }}
          PREVIOUS_VERSION: ${{ needs.changes.outputs.previous_version }}
          SECURITY_CHANGED: ${{ needs.changes.outputs.security_changed }}
        run: |
          if [[ "${ESTIMATOR_CHANGED}" != true ]] && \
             ! docker buildx imagetools inspect \
               "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/estimator-api:latest" >/dev/null 2>&1; then
            docker buildx imagetools create \
              --tag "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/estimator-api:latest" \
              "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/estimator-api:${PREVIOUS_VERSION}"
          fi
          if [[ "${SECURITY_CHANGED}" != true ]] && \
             ! docker buildx imagetools inspect \
               "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/security-service:latest" >/dev/null 2>&1; then
            docker buildx imagetools create \
              --tag "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/security-service:latest" \
              "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/security-service:${PREVIOUS_VERSION}"
          fi
