name: Publish container images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: estimator-api
            dockerfile: estimator-api/Dockerfile
          - image: security-service
            dockerfile: security-service/Dockerfile

    steps:
      - name: Check out repository and estimator
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi

      - name: Verify estimator commit
        if: matrix.image == 'estimator-api'
        shell: bash
        run: |
          expected_commit="$(git ls-tree HEAD estimator | awk '{print $3}')"
          actual_commit="$(git -C estimator rev-parse HEAD)"
          if [[ -z "${expected_commit}" ]]; then
            echo "The estimator Gitlink is missing from this release" >&2
            exit 1
          fi
          if [[ "${actual_commit}" != "${expected_commit}" ]]; then
            echo "Expected estimator ${expected_commit}, found ${actual_commit}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
