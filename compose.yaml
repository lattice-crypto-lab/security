# Lattice Security 的生产部署配置。
#
# 快速启动：
#   docker compose pull
#   docker compose up -d
#
# 建议把经常修改的值放在与本文件同目录的 `.env` 中，例如：
#   SECURITY_SERVICE_VERSION=0.1.1
#   ESTIMATOR_API_VERSION=0.1.0
#   LATTICE_SECURITY_PORT=8080
#   LATTICE_SECURITY_API_TOKEN=<使用 openssl rand -hex 32 生成>
#
# 两个镜像默认使用各自的 latest。生产环境如需可重复部署，应分别固定版本。
name: lattice-security

services:
  estimator-api:
    # 首版镜像仅构建 linux/amd64。ARM 主机需要模拟运行，性能可能明显下降。
    platform: linux/amd64
    image: ghcr.io/lattice-crypto-lab/estimator-api:${ESTIMATOR_API_VERSION:-latest}
    # expose 只向 Compose 内部网络声明端口，不会把 Sage API 发布到宿主机。
    expose:
      - "8000"
    networks:
      - backend
    restart: unless-stopped
    # 容器根文件系统保持只读；Sage 需要写入的临时目录使用内存文件系统。
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/sage/.cache:size=128m,uid=1000,gid=1000
      - /home/sage/.sage:size=64m,uid=1000,gid=1000
    # 删除 Linux capabilities，并禁止进程通过 setuid 等方式提升权限。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 可在 `.env` 中用 ESTIMATOR_CPUS 和 ESTIMATOR_MEMORY 调整。
    # 实际 Sage 估算内存不足时可将 ESTIMATOR_MEMORY 提高到 6g 或 8g。
    cpus: "${ESTIMATOR_CPUS:-2.0}"
    mem_limit: "${ESTIMATOR_MEMORY:-4g}"

  security-service:
    platform: linux/amd64
    image: ghcr.io/lattice-crypto-lab/security-service:${SECURITY_SERVICE_VERSION:-latest}
    # 等 estimator-api 健康检查通过后再启动公共服务。
    depends_on:
      estimator-api:
        condition: service_healthy
    environment:
      # Compose 内部服务地址；通常不需要修改。
      ESTIMATOR_API_URL: http://estimator-api:8000/
      LATTICE_SECURITY_BIND: 0.0.0.0:8080
      LATTICE_SECURITY_DATABASE: /var/lib/lattice-security/lattice-security.db
      # 留空表示不认证；设置后 Web 登录和 JSON API 都必须使用同一个 Token。
      # 对局域网开放端口时强烈建议配置，并同时使用防火墙限制访问来源。
      LATTICE_SECURITY_API_TOKEN: "${LATTICE_SECURITY_API_TOKEN:-}"
      # 可改为 debug 获取更详细日志；正常使用建议保持 info。
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      # 默认只绑定宿主机 loopback，因此其他机器无法访问。
      # 修改外部端口：在 `.env` 中设置 LATTICE_SECURITY_PORT=其他端口。
      # 允许局域网访问：把下面的 127.0.0.1 改成宿主机局域网 IP 或 0.0.0.0；
      # 使用 0.0.0.0 时务必配置 API Token 和主机防火墙。
      - "127.0.0.1:${LATTICE_SECURITY_PORT:-8080}:8080"
    networks:
      - backend
    volumes:
      # SQLite 数据库和攻击缓存保存在命名 volume 中；重建容器不会丢失。
      # `docker compose down -v` 会删除这个 volume，请谨慎使用。
      - lattice-security-data:/var/lib/lattice-security
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 可在 `.env` 中用 SECURITY_SERVICE_CPUS 和 SECURITY_SERVICE_MEMORY 调整。
    cpus: "${SECURITY_SERVICE_CPUS:-1.0}"
    mem_limit: "${SECURITY_SERVICE_MEMORY:-512m}"

networks:
  backend:
    # internal 网络不能直接访问外网，也不会向宿主机发布 estimator-api。
    # security-service 仍能通过该网络调用 estimator-api。
    internal: true

volumes:
  # Docker 管理的持久卷。备份时应备份其中的 lattice-security.db。
  lattice-security-data:
