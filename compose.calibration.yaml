services:
  calibration:
    image: ghcr.io/lattice-crypto-lab/estimator-api:${ESTIMATOR_API_VERSION:-latest}
    platform: linux/amd64
    depends_on:
      estimator-api:
        condition: service_healthy
    entrypoint:
      - sage
      - -python
      - /app/estimator-api/tools/phase4_calibration.py
    volumes:
      - ./calibration:/calibration
