<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ name }} · Lattice Security</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head>
<body><header class="topbar"><div><p class="eyebrow">PARAMETER SET</p><h1>{{ name }}</h1></div><a class="back" href="/">← 返回工作台</a></header>
<main><section class="panel section-panel"><div class="section-heading"><div><span class="mono">{{ id }}</span><p>{{ description }}</p></div><span>{{ cases.len() }} cases</span></div>
<form method="post" action="/ui/parameter-sets/{{ id }}/run" data-collect-form>
  <input type="hidden" name="case_ids" data-collect-output>
  <div class="case-list">{% for case in cases %}<label class="case-select"><input type="checkbox" value="{{ case.id }}" data-batch-select><span><strong>{{ case.name }}</strong><small class="mono">{{ case.id }}</small><code>{{ case.problem }}</code></span></label>{% endfor %}</div>
  <div class="form-row compact"><label>总超时<input name="timeout_seconds" type="number" min="2" max="7200" value="3600"></label><label>慢攻击判断<input name="decision_after_seconds" type="number" min="1" max="7199" value="60"></label><label>高安全阈值<input name="high_security_bits" value="128"></label></div>
  <p class="muted">未选择 case 时运行全部。</p><button class="primary" type="submit">运行选中 case</button>
</form></section></main></body></html>
